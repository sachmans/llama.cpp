version = 1

; Global defaults applied to all models
; TBQ4_0 = TurboQuant 4-bit KV cache: 3.9x compression, +2% PPL, 4x context
[*]
n-gpu-layers = 99
ctx-size = 32768
flash-attn = on
cache-type-k = tbq4_0
cache-type-v = tbq3_0

; ── Groq-parity LLMs ──────────────────────────────────────────────────────────
[llama-3.3-70b-versatile]
hf-repo = bartowski/Llama-3.3-70B-Instruct-GGUF:Q4_K_M
hf-repo-draft = bartowski/Meta-Llama-3.1-8B-Instruct-GGUF:Q4_K_M
draft-max = 16
draft-p-min = 0.75
parallel = 2

; Llama-3.1-8B: NaN bug on this branch (base regression, not TBQ)
[llama-3.1-8b-instant]
hf-repo = bartowski/Meta-Llama-3.1-8B-Instruct-GGUF:Q4_K_M
ctx-size = 8192
parallel = 4
cache-type-k = q8_0
cache-type-v = q8_0

[mixtral-8x7b-32768]
hf-repo = MaziyarPanahi/Mixtral-8x7B-Instruct-v0.1-GGUF:Q4_K_M
ctx-size = 32768

[qwen/qwen3-32b]
hf-repo = ggml-org/Qwen3-32B-GGUF:Q4_K_M
ctx-size = 32768
parallel = 4
reasoning-budget = 1024

; Kimi K2 is ~200GB — runs via mmap + SSD paging.
; n-gpu-layers MUST be 0: Metal requires all offloaded layers physically resident,
; while CPU layers support mmap so macOS pages inactive expert weights from SSD on demand.
; MoE architecture helps: only ~32B params active per token, so most expert weights stay cold.
; First inference is slow (SSD page faults loading ~6GB of expert weights); warms up after that.
[moonshotai/kimi-k2-instruct-0905]
hf-repo = unsloth/Kimi-K2-Instruct-GGUF:UD-IQ1_S
ctx-size = 8192
n-gpu-layers = 0

; ── Groq-parity Vision ────────────────────────────────────────────────────────
[llama-4-scout-17b-16e-instruct]
hf-repo = ggml-org/Llama-4-Scout-17B-16E-Instruct-GGUF

; Proxy for gemini-2.5-flash-image — best available local vision model
; Qwen2.5-VL: broken with any KV quant below Q8_0 (even upstream Q4_0)
[gemini-2.5-flash-image]
hf-repo = ggml-org/Qwen2.5-VL-7B-Instruct-GGUF
cache-type-k = q8_0
cache-type-v = q8_0

; ── Groq-parity Proprietary Proxies ──────────────────────────────────────────
; Best open-source equivalents for drop-in local use
[claude-sonnet-4-20250514]
hf-repo = bartowski/Qwen2.5-72B-Instruct-GGUF:Q3_K_M
parallel = 2

[claude-haiku-4-5-20251001]
hf-repo = bartowski/Meta-Llama-3.1-8B-Instruct-GGUF:Q4_K_M
cache-type-k = q8_0
cache-type-v = q8_0

[gpt-4o-mini]
hf-repo = bartowski/Meta-Llama-3.1-8B-Instruct-GGUF:Q4_K_M
cache-type-k = q8_0
cache-type-v = q8_0

; ── Groq-parity Embeddings ────────────────────────────────────────────────────
[nomic-embed-text-v1.5]
hf-repo = nomic-ai/nomic-embed-text-v1.5-GGUF
embeddings = true
parallel = 4
batch-size = 8192
ubatch-size = 8192

; ── Additional models (not in Groq inventory, kept for utility) ───────────────
; Gemma 3 4B: only 5 global-attn KV layers (29 SWA), KV is tiny — TQ not needed
[gemma3-4b]
hf-repo = ggml-org/gemma-3-4b-it-GGUF
cache-type-k = f16
cache-type-v = f16
parallel = 4

[gemma4-31b]
hf-repo = bartowski/google_gemma-4-31B-it-GGUF:Q4_K_M

[qwq-32b]
hf-repo = Qwen/QwQ-32B-GGUF:Q4_K_M
reasoning-budget = 2048

[qwen2.5-72b]
hf-repo = bartowski/Qwen2.5-72B-Instruct-GGUF:Q3_K_M
parallel = 2

; Vision/audio models: keep Q8_0 (VL models break with aggressive KV quant)
[qwen2.5-vl-7b]
hf-repo = ggml-org/Qwen2.5-VL-7B-Instruct-GGUF
cache-type-k = q8_0
cache-type-v = q8_0

[qwen2.5-omni-7b]
hf-repo = ggml-org/Qwen2.5-Omni-7B-GGUF
cache-type-k = q8_0
cache-type-v = q8_0

[ultravox-8b]
hf-repo = ggml-org/ultravox-v0_5-llama-3_1-8b-GGUF
cache-type-k = q8_0
cache-type-v = q8_0
